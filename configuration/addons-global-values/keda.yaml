# ====================================================================== #
# KEDA Global Values
# ====================================================================== #
# Chart: keda
# Repo: https://kedacore.github.io/charts
# Docs: https://keda.sh/docs/
#
# These values apply to ALL clusters unless overridden per-cluster
# in addons-clusters-values/<cluster-name>.yaml
# ====================================================================== #

crds:
  install: true

operator:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
    limits:
      cpu: 1
      memory: 1000Mi
  logging:
    level: info
    format: console
    timeEncoding: rfc3339

metricsServer:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
    limits:
      cpu: 1
      memory: 1000Mi

webhooks:
  enabled: true
  replicaCount: 1
  failurePolicy: Ignore
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
    limits:
      cpu: 1
      memory: 1000Mi

serviceAccount:
  operator:
    create: true
    name: keda-operator-sa
    annotations: {}
  metricServer:
    create: true
    annotations: {}
  webhooks:
    create: true
    annotations: {}

rbac:
  create: true

certificates:
  autoGenerated: true

# ====================================================================== #
# Cluster-Specific Overrides Reference
# ====================================================================== #
# keda:
#   serviceAccount:
#     operator:
#       annotations:
#         eks.amazonaws.com/role-arn: arn:aws:iam::<accountId>:role/keda-<clusterName>
