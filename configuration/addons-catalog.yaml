# ================================================================ #
# Addons Catalog - Available Helm Charts
# ================================================================ #
# See docs/VALUES_GUIDE.md for full documentation
#
# Example:
#   - appName: keda                    # Required: addon name
#     repoURL: https://kedacore.io     # Required: Helm repo
#     chart: keda                      # Required: chart name
#     version: 2.14.2                  # Required: version
#     namespace: kube-system           # Optional: custom namespace (defaults to appName)
#     ignoreDifferences: []            # Optional: ArgoCD ignore rules
#     inMigration: false               # Optional: enable migration mode (see docs/ADDON-MIGRATION.md)
# ================================================================ #

applicationsets:
  # ---- Multi-source pattern: Helm chart + ExternalSecret for API key ---- #
  - appName: datadog
    repoURL: https://helm.datadoghq.com
    chart: datadog
    version: 3.160.1

  # ---- Simple addon pattern ---- #
  - appName: keda
    repoURL: https://kedacore.github.io/charts
    chart: keda
    version: 2.14.2

  # ---- Multi-source pattern: Helm chart + ClusterSecretStore ---- #
  - appName: external-secrets
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    version: 0.19.2

  # ---- Sync-wave ordering pattern (multiple related charts) ---- #
  # Istio components must deploy in order: base -> cni -> istiod -> ingress
  - appName: istio-base
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: base
    version: 1.28.0
    namespace: istio-system

  - appName: istiod
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    version: 1.28.0
    namespace: istio-system

  - appName: istio-cni
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: cni
    version: 1.28.0
    namespace: istio-system

  - appName: istio-ingress
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: gateway
    version: 1.28.0
    namespace: istio-system

  # ---- ServerSideApply pattern ---- #
  - appName: kyverno
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    version: 3.3.4

  # ---- Standard addon patterns ---- #
  - appName: cert-manager
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    version: 1.17.1

  - appName: argo-rollouts
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    version: 2.39.5

  - appName: external-dns
    repoURL: https://kubernetes-sigs.github.io/external-dns
    chart: external-dns
    version: 1.17.0

  # ---- Add your own addons here ---- #
  # Any Helm chart works. Just add an entry and enable via cluster labels.
  # - appName: my-addon
  #   repoURL: https://my-charts.example.com
  #   chart: my-addon
  #   version: 1.0.0
  #   namespace: my-namespace  # Optional, defaults to appName

# ================================================================ #
# Migration / Adoption Mode Configuration (Optional)
# ================================================================ #
# Enable inMigration: true on specific addons to inject these
# ignoreDifferences rules during zero-downtime migration from
# another ArgoCD instance. See docs/ADDON-MIGRATION.md
# ================================================================ #
migrationIgnoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
      - /spec/template

  - group: apps
    kind: StatefulSet
    jsonPointers:
      - /spec/template

  - group: apps
    kind: DaemonSet
    jsonPointers:
      - /spec/template

  - group: batch
    kind: Job
    jsonPointers:
      - /spec/template

  - group: batch
    kind: CronJob
    jsonPointers:
      - /spec/jobTemplate/spec/template
