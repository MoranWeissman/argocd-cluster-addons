# This template creates an ExternalSecret for each cluster in the clusters list
# Supports both AWS and GCP cloud providers via bootstrap.cloudProvider setting
{{- range .Values.clusters }}
{{- $secretName := printf "k8s-%s" .name }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: argocd
spec:
  secretStoreRef:
    name: global-secret-store
    kind: ClusterSecretStore
  refreshInterval: "1h"
  target:
    name: {{ .name }}
    creationPolicy: 'Owner'
    template:
      type: Opaque
      metadata:
        labels:
          argocd.argoproj.io/secret-type: cluster
          {{- range $key, $value := .labels }}
          {{ $key }}: {{ $value }}
          {{- end }}
          {{- if eq ($.Values.bootstrap.cloudProvider | default "aws") "aws" }}
          eksAutoMode: '{{"{{ index . \"eksAutoMode\" | default \"false\" }}"}}'
          {{- end }}
        annotations:
          dd_tags: '{{"{{ index . \"dd_tags\" | default \"\" }}"}}'
          region: '{{"{{ index . \"region\" | default \"\" }}"}}'
          {{- if eq ($.Values.bootstrap.cloudProvider | default "aws") "aws" }}
          accountId: '{{"{{ .accountId }}"}}'
          {{- end }}
          {{- if eq ($.Values.bootstrap.cloudProvider | default "aws") "gcp" }}
          gcpProjectId: '{{"{{ index . \"gcpProjectId\" | default \"\" }}"}}'
          {{- end }}
      data:
        name: {{ .name }}
        namespace: argocd
        server: '{{"{{ .host }}"}}'
        config: |
          {{- if eq ($.Values.bootstrap.cloudProvider | default "aws") "aws" }}
          {
            "execProviderConfig": {
              "apiVersion": "client.authentication.k8s.io/v1beta1",
              "command": "argocd-k8s-auth",
              "args": [
                "aws",
                "--cluster-name",
                "{{"{{ .clusterName }}"}}",
                "--role-arn",
                "arn:aws:iam::{{"{{ .accountId }}"}}:role/<YourEKSAdminAssumeRole>"
              ],
              "env": {
                "AWS_REGION": "{{"{{ .region }}"}}"
              }
            },
            "tlsClientConfig": {
              "insecure": false,
              "caData": "{{"{{ .caData }}"}}"
            }
          }
          {{- else if eq ($.Values.bootstrap.cloudProvider | default "aws") "gcp" }}
          {
            "execProviderConfig": {
              "apiVersion": "client.authentication.k8s.io/v1beta1",
              "command": "argocd-k8s-auth",
              "args": ["gcp"]
            },
            "tlsClientConfig": {
              "insecure": false,
              "caData": "{{"{{ .caData }}"}}"
            }
          }
          {{- end }}
  {{- if eq ($.Values.bootstrap.cloudProvider | default "aws") "aws" }}
  # AWS: Fetch all properties from cluster secret (including optional eksAutoMode)
  dataFrom:
    - extract:
        key: {{ $secretName }}
  {{- else if eq ($.Values.bootstrap.cloudProvider | default "aws") "gcp" }}
  # GCP: Fetch individual properties from GCP Secret Manager
  data:
    - secretKey: clusterName
      remoteRef:
        key: {{ $secretName }}
        property: clusterName
    - secretKey: host
      remoteRef:
        key: {{ $secretName }}
        property: host
    - secretKey: caData
      remoteRef:
        key: {{ $secretName }}
        property: caData
        decodingStrategy: None
    - secretKey: dd_tags
      remoteRef:
        key: {{ $secretName }}
        property: dd_tags
    - secretKey: region
      remoteRef:
        key: {{ $secretName }}
        property: region
  {{- end }}
---
{{- end }}
