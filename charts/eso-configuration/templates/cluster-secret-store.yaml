apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: global-secret-store
spec:
  provider:
    {{- if eq (.Values.cloudProvider | default "aws") "aws" }}
    aws:
      service: SecretsManager
      region: {{ .Values.secretManagerRegion }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.esoServiceAccount }}
            namespace: {{ .Values.esoNamespace }}
    {{- else if eq .Values.cloudProvider "gcp" }}
    gcpsm:
      projectID: {{ .Values.gcpProjectID | required "gcpProjectID is required for GCP provider" }}
      auth:
        workloadIdentity:
          clusterLocation: {{ .Values.secretManagerRegion }}
          clusterName: {{ .Values.gkeClusterName | default "" }}
          serviceAccountRef:
            name: {{ .Values.esoServiceAccount }}
            namespace: {{ .Values.esoNamespace }}
    {{- end }}
